[package]
name = "inputsmith-gui"
description = "inputsmith settings app and tray icon"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "inputsmith-gui"
path = "src/main.rs"

[dependencies]
inputsmith-ipc.workspace = true
iced = { version = "0.14", features = ["image", "svg", "tokio", "advanced"] }
tray-icon = "0.26"
image = { version = "0.25", default-features = false, features = ["webp", "png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log.workspace = true
env_logger = "0.11"
futures = "0.3"
rfd = "0.17"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_Threading",
] }

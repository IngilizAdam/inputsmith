[package]
name = "inputsmith-agent"
description = "inputsmith background agent: devices, profiles, button actions, gestures"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "inputsmith-agent"
path = "src/main.rs"

[dependencies]
inputsmith-hidpp.workspace = true
inputsmith-ipc.workspace = true
inputsmith-input.workspace = true
log.workspace = true
thiserror.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
env_logger = "0.11"
ctrlc = "3"

# Tests and packages Inputsmith for every supported platform. Called by ci.yml (every push) and
# release.yml (version tags); each job uploads its installers as a workflow artifact.
# New platforms (e.g. Linux .deb/.rpm) get their own job here; release.yml publishes every artifact.
name: Build

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to build (default: the triggering commit)"
        type: string
        default: ''

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Rust toolchain
        run: rustup update stable --no-self-update; rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace --locked

      - name: Install WiX Toolset
        run: |
          dotnet tool install --global wix --version 5.0.2
          "$env:USERPROFILE\.dotnet\tools" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Add WiX extensions
        run: wix extension add --global WixToolset.Util.wixext/5.0.2

      - name: Package (msi)
        # WiX errors become annotations, so they show on the run's summary page.
        run: |
          ./tools/package.ps1 2>&1 | ForEach-Object {
            $line = "$_"
            if ($line -match '\b(error|warning) WIX\d+') { "::$($Matches[1])::$line" } else { $line }
          }

      - uses: actions/upload-artifact@v6
        with:
          name: windows-x64
          path: dist/*.msi
          if-no-files-found: error
